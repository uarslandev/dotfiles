# ==============================================================================
# Modern Tmux Configuration
# ==============================================================================

# Change prefix key to Ctrl-A (easier to press than Ctrl-B)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Enable 24-bit True Color & Mouse support
set -g default-terminal "screen-256color"
set-option -sa terminal-overrides ",xterm-256color:RGB"
set -g mouse on

# Start window and pane numbering at 1 (instead of 0)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Easy split keybindings (| and -)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# Vim-style pane switching (Alt + h/j/k/l without prefix)
bind -n M-h select-pane -L
bind -n M-l select-pane -R
bind -n M-k select-pane -U
bind -n M-j select-pane -D

# Reload tmux config easily with 'r'
bind r source-file ~/.tmux.conf \; display-message "Tmux config reloaded!"

# Vi copy mode settings
set-window-option -g mode-keys vi
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

# Statusbar Styling (TokyoNight Theme Palette)
set -g status-position top
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 40
set -g status-right-length 80
set -g status-left "#[fg=#7aa2f7,bold]  #S #[fg=#565f89]| "
set -g status-right "#[fg=#bb9af7]%Y-%m-%d #[fg=#7dcfff]%H:%M #[fg=#7aa2f7]#H "

setw -g window-status-current-style "fg=#7aa2f7,bg=#24283b,bold"
setw -g window-status-current-format " #I:#W#F "
setw -g window-status-style "fg=#565f89,bg=#1a1b26"
setw -g window-status-format " #I:#W "
